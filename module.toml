# ── Settings manifest ───────────────────────────────────────────────────────────
# Declarative source of truth for the module's parameters. The core seeds the
# instance-level rows (scope global|overridable) into core.settings and resolves the
# effective value (user override ?? global default) per user. These admin-only,
# instance-wide settings are edited from the core admin console, not from a route
# inside the module.
#   scope = "global"      → admin only, instance-wide
#   scope = "user"        → per-user only
#   scope = "overridable" → admin default, each user may override it

[[setting_groups]]
id       = "stockage"
label    = "Stockage"
icon     = "HardDrive"
position = 1
description = "Le poids maximal de ce qu'un utilisateur peut enregistrer ou importer depuis les éditeurs de la suite."

[[setting_groups]]
id       = "collaboration"
label    = "Collaboration"
icon     = "Users"
position = 2
description = "L'édition à plusieurs, en temps réel, sur un même document."

[[settings]]
key         = "max_document_bytes"
scope       = "global"
type        = "int"
default     = 52428800
min         = 1048576
max         = 2147483648
unit        = "octets"
label       = "Taille maximale d'un document"
description = "Poids maximal d'un document enregistré, mesuré sur le contenu COMPRESSÉ tel qu'il est stocké dans les fichiers. S'applique aux sept éditeurs (Vertex, Apex, Layer, Motion, Keyframe, PdfWriter, FontEditor) : l'enregistrement au-delà de ce plafond est refusé. Les pixels des calques, les textures de scène et les médias vidéo sont stockés à part et ne sont pas comptés ici."
category    = "Documents"
group       = "stockage"

[[settings]]
key         = "max_media_bytes"
scope       = "global"
type        = "int"
default     = 5368709120
min         = 1048576
max         = 107374182400
unit        = "octets"
label       = "Taille maximale d'un média importé"
description = "Poids maximal d'un fichier vidéo, audio ou image importé dans un projet Motion, que l'import passe par le navigateur ou par une reprise directe depuis les fichiers. Laissé à sa valeur d'usine, c'est la valeur du fichier de configuration du serveur qui continue de s'appliquer."
category    = "Médias (Motion)"
group       = "stockage"

[[settings]]
key         = "enable_collaboration"
scope       = "global"
type        = "bool"
default     = true
label       = "Édition collaborative"
description = "Autoriser plusieurs personnes à travailler simultanément sur un même document. Désactivé, le serveur refuse l'ouverture des sessions temps réel des sept éditeurs ; les documents restent modifiables, mais un seul poste à la fois voit ses changements."
category    = "Édition en temps réel"
group       = "collaboration"

[events]
subscribed = ["UserDeleted"]
publishes  = []
